   </g>
   <g id="text_4">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(254.519569 118.785809)">does a closed equation exist</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(262.687584 126.707613)">at this coarse-graining?</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #d55e00" transform="translate(461.32165 93.757344)">computational</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #d55e00" transform="translate(468.8179 103.359531)">tractability</text>
   </g>
   <g id="text_6">
