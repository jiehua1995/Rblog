   <g id="text_8">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(31.2336 181.076391)">the gates are independent: a model can be identifiable but intractable,</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(31.2336 188.998195)">or tractable but not identifiable. Passing all three is what 'predictive</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(31.2336 196.92)">sufficiency' means here, and it is a property of the question, not of the model.</text>
