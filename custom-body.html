<footer class="site-footer">
<div class="site-footer-inner">
<div class="site-footer-brand">
<img src="/favicon.png" alt="">
<div>
<span class="footer-name">Jie Hua</span>
<span class="footer-sub">Bioinformatics Notes</span>
</div>
</div>
<nav class="site-footer-nav" aria-label="Footer">
<a href="/articles.html">Archive</a>
<a href="/about.html">About</a>
<a href="https://www.jiehua1995.xyz/" target="_blank" rel="noopener"><i class="fa-solid fa-globe" aria-hidden="true"></i>Homepage</a>
<a href="https://github.com/jiehua1995" target="_blank" rel="noopener"><i class="fa-brands fa-github" aria-hidden="true"></i>GitHub</a>
<a href="/index.xml"><i class="fa-solid fa-rss" aria-hidden="true"></i>RSS</a>
</nav>
<div class="site-footer-meta">© 2025 · Built with <a href="https://quarto.org" target="_blank" rel="noopener">Quarto</a> · Published on <a href="https://www.netlify.com" target="_blank" rel="noopener">Netlify</a></div>
</div>
</footer>
<div class="reading-progress" aria-hidden="true"><span></span></div>
<script>
(function () {
  "use strict";

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- fluid dock: sliding liquid lens ---------- */
  function initLiquidDocks() {
    document.querySelectorAll(".liquid-dock").forEach(function (dock) {
      var lens = dock.querySelector(".liquid-lens");
      if (!lens) {
        lens = document.createElement("span");
        lens.className = "liquid-lens";
        dock.insertBefore(lens, dock.firstChild);
      }
      var items = Array.prototype.slice.call(dock.querySelectorAll("a"));
      var moveTo = function (el) {
        lens.style.width = el.offsetWidth + "px";
        lens.style.height = el.offsetHeight + "px";
        lens.style.transform = "translate(" + el.offsetLeft + "px," + el.offsetTop + "px)";
        lens.classList.add("is-active");
      };
      items.forEach(function (el) {
        el.addEventListener("pointerenter", function () { moveTo(el); });
        el.addEventListener("focus", function () { moveTo(el); });
      });
      dock.addEventListener("pointerleave", function () {
        lens.classList.remove("is-active");
      });
    });
  }

  /* ---------- light / dark segmented pill ---------- */
  function initThemePill() {
    document.querySelectorAll(".quarto-color-scheme-toggle").forEach(function (toggle) {
      toggle.classList.add("theme-pill");
      toggle.innerHTML =
        '<span class="theme-thumb"></span>' +
        '<i class="fa-solid fa-sun" aria-hidden="true"></i>' +
        '<i class="fa-solid fa-moon" aria-hidden="true"></i>';
      toggle.setAttribute("title", "Toggle light / dark");
      toggle.setAttribute("aria-label", "Toggle light / dark");
    });
  }

  /* ---------- give the brand a two-line wordmark ---------- */
  function initBrand() {
    var title = document.querySelector(".navbar-title");
    if (!title || title.dataset.enhanced) return;
    var full = title.textContent.trim();
    var match = full.match(/^(.+?)['’]s\s+(.+)$/);
    if (!match) return;
    title.dataset.enhanced = "true";
    title.setAttribute("aria-label", full);
    title.innerHTML =
      '<span class="brand-name">' + match[1] + "</span>" +
      '<span class="brand-sub">' + match[2] + "</span>";
  }

  /* ---------- keep all controls in the top-right cluster ---------- */
  function initNavbarLayout() {
    var search = document.getElementById("quarto-search");
    var tools = document.querySelector(".quarto-navbar-tools");
    if (search && tools && !tools.contains(search)) {
      tools.insertBefore(search, tools.firstChild);
    }
  }

  /* ---------- labels for icon-only nav items (visible in the mobile menu) ---------- */
  function initNavLabels() {
    document.querySelectorAll(".navbar .nav-item.compact .nav-link").forEach(function (link) {
      var text = link.querySelector(".menu-text");
      if (!text || text.textContent.trim()) return;
      var href = (link.getAttribute("href") || "").toLowerCase();
      if (href.indexOf("github") > -1) text.textContent = "GitHub";
      else if (href.indexOf("index.xml") > -1 || href.indexOf("rss") > -1) text.textContent = "RSS";
    });
  }

  /* ---------- icons for the text nav items ---------- */
  function initNavIcons() {
    document.querySelectorAll(".navbar .navbar-nav .nav-item .nav-link").forEach(function (link) {
      if (link.querySelector("i")) return;
      var href = (link.getAttribute("href") || "").toLowerCase();
      var icon = null;
      if (href.indexOf("articles.html") > -1) icon = "fa-solid fa-box-archive";
      else if (href.indexOf("about.html") > -1) icon = "fa-solid fa-circle-info";
      if (!icon) return;
      var el = document.createElement("i");
      el.className = icon;
      el.setAttribute("aria-hidden", "true");
      var text = link.querySelector(".menu-text");
      link.insertBefore(el, text || link.firstChild);
    });
  }

  /* ---------- replace Quarto's Bootstrap icons with Font Awesome ---------- */
  function initIcons() {
    var map = {
      "bi-github": ["fa-brands", "fa-github"],
      "bi-rss": ["fa-solid", "fa-rss"],
      "bi-search": ["fa-solid", "fa-magnifying-glass"],
      "bi-sort-down": ["fa-solid", "fa-arrow-down-wide-short"],
      "bi-sort-up": ["fa-solid", "fa-arrow-up-wide-short"],
      "bi-list": ["fa-solid", "fa-bars"],
      "bi-x-lg": ["fa-solid", "fa-xmark"],
      "bi-check": ["fa-solid", "fa-check"],
      "bi-copy": ["fa-regular", "fa-copy"]
    };

    document.querySelectorAll("i.bi").forEach(function (el) {
      var found = null;
      Object.keys(map).forEach(function (key) {
        if (el.classList.contains(key)) found = key;
      });
      if (!found) return;
      el.classList.remove("bi", found);
      map[found].forEach(function (cls) { el.classList.add(cls); });
    });

    document.querySelectorAll(".code-copy-button i.bi").forEach(function (el) {
      el.classList.remove("bi");
      el.classList.add("fa-regular", "fa-copy");
    });

    var searchButton = document.querySelector(".aa-DetachedSearchButton");
    if (searchButton && !searchButton.dataset.faIcon) {
      searchButton.dataset.faIcon = "true";
      var iconSlot = searchButton.querySelector(".aa-DetachedSearchButtonIcon");
      if (iconSlot) {
        iconSlot.innerHTML = '<i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>';
      }
    }
  }

  /* ---------- custom sort dropdown ---------- */
  function initSortDropdowns() {
    document.querySelectorAll(".quarto-listing-sort").forEach(function (group) {
      var select = group.querySelector("select");
      if (!select || group.dataset.enhanced) return;
      group.dataset.enhanced = "true";

      var wrap = document.createElement("div");
      wrap.className = "sort-dropdown";
      var button = document.createElement("button");
      button.type = "button";
      button.className = "sort-toggle";
      button.setAttribute("aria-haspopup", "listbox");
      button.setAttribute("aria-expanded", "false");
      button.innerHTML =
        '<span class="sort-toggle-label">Sort by</span>' +
        '<i class="fa-solid fa-chevron-down" aria-hidden="true"></i>';

      var menu = document.createElement("div");
      menu.className = "sort-menu";
      menu.setAttribute("role", "listbox");

      Array.prototype.forEach.call(select.options, function (option, index) {
        if (!option.value) return;
        var item = document.createElement("button");
        item.type = "button";
        item.className = "sort-option";
        item.setAttribute("role", "option");
        item.textContent = option.textContent.trim();
        item.dataset.sortValue = option.value;
        item.dataset.sortIndex = String(index);
        item.dataset.direction = option.getAttribute("data-direction") || "";
        item.addEventListener("click", function () {
          // options can share the same value and differ only by data-direction,
          // so select by index instead of by value
          select.selectedIndex = Number(item.dataset.sortIndex);
          select.dispatchEvent(new Event("change", { bubbles: true }));
          button.querySelector(".sort-toggle-label").textContent = option.textContent.trim();
          menu.querySelectorAll(".sort-option").forEach(function (other) {
            other.classList.remove("is-selected");
            other.setAttribute("aria-selected", "false");
          });
          item.classList.add("is-selected");
          item.setAttribute("aria-selected", "true");
          close();
        });
        menu.appendChild(item);
      });

      var initial = menu.querySelector('[data-sort-value="listing-date-sort"][data-direction="desc"]');
      if (initial) {
        button.querySelector(".sort-toggle-label").textContent = initial.textContent.trim();
        initial.classList.add("is-selected");
        initial.setAttribute("aria-selected", "true");
      }

      function close() {
        wrap.classList.remove("is-open");
        button.setAttribute("aria-expanded", "false");
      }

      button.addEventListener("click", function (event) {
        event.stopPropagation();
        var open = wrap.classList.toggle("is-open");
        button.setAttribute("aria-expanded", open ? "true" : "false");
      });

      document.addEventListener("click", function (event) {
        if (!wrap.contains(event.target)) close();
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") close();
      });

      wrap.appendChild(button);
      wrap.appendChild(menu);
      group.parentNode.insertBefore(wrap, group);
      group.style.display = "none";
    });
  }

  /* ---------- share buttons on articles ---------- */
  function initShare() {
    if (!document.querySelector(".quarto-title-banner")) return;
    var meta = document.querySelector(".quarto-title-meta");
    if (!meta || meta.querySelector(".quarto-title-meta-share")) return;

    var url = encodeURIComponent(window.location.href);
    var title = encodeURIComponent(document.title);
    var wrap = document.createElement("div");
    wrap.className = "quarto-title-meta-share";
    wrap.innerHTML =
      '<span class="share-label">Share</span>' +
      '<a class="share-btn" href="https://twitter.com/intent/tweet?url=' + url + "&text=" + title +
      '" target="_blank" rel="noopener" aria-label="Share on X"><i class="fa-brands fa-x-twitter" aria-hidden="true"></i></a>' +
      '<a class="share-btn" href="https://www.linkedin.com/sharing/share-offsite/?url=' + url +
      '" target="_blank" rel="noopener" aria-label="Share on LinkedIn"><i class="fa-brands fa-linkedin-in" aria-hidden="true"></i></a>' +
      '<button type="button" class="share-btn share-copy" aria-label="Copy link"><i class="fa-solid fa-link" aria-hidden="true"></i></button>';
    meta.appendChild(wrap);

    var copy = wrap.querySelector(".share-copy");
    copy.addEventListener("click", function () {
      var button = this;
      var done = function () {
        button.classList.add("is-copied");
        button.innerHTML = '<i class="fa-solid fa-check" aria-hidden="true"></i>';
        window.setTimeout(function () {
          button.classList.remove("is-copied");
          button.innerHTML = '<i class="fa-solid fa-link" aria-hidden="true"></i>';
        }, 1600);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(window.location.href).then(done).catch(function () {});
      } else {
        done();
      }
    });
  }

  /* ---------- search: hero button + keyboard shortcut ---------- */
  function openSearch() {
    var btn = document.querySelector(".aa-DetachedSearchButton");
    if (btn) btn.click();
  }

  function initSearch() {
    document.querySelectorAll("[data-search-open]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.preventDefault();
        openSearch();
      });
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openSearch();
        }
      });
    });

    var isMac = /Mac|iPhone|iPad/.test(navigator.platform || "");
    document.querySelectorAll(".search-kbd").forEach(function (kbd) {
      kbd.textContent = isMac ? "⌘ K" : "Ctrl K";
    });

    document.addEventListener("keydown", function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        openSearch();
      }
    });
  }

  /* ---------- reading progress (post pages) ---------- */
  function initProgress() {
    if (!document.querySelector(".quarto-title-banner")) return;
    var bar = document.querySelector(".reading-progress span");
    if (!bar) return;
    var ticking = false;
    var update = function () {
      var max = document.documentElement.scrollHeight - window.innerHeight;
      var value = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
      bar.style.transform = "scaleX(" + value + ")";
      ticking = false;
    };
    window.addEventListener("scroll", function () {
      if (!ticking) {
        ticking = true;
        window.requestAnimationFrame(update);
      }
    }, { passive: true });
    update();
  }

  /* ---------- drop the redundant "modified" block ---------- */
  function initMetaCleanup() {
    var published = document.querySelector(".quarto-title-meta .date");
    var modified = document.querySelector(".quarto-title-meta .date-modified");
    if (!published || !modified) return;
    if (published.textContent.trim() !== modified.textContent.trim()) return;
    var block = modified.closest(".quarto-title-meta > div");
    if (block) block.remove();
  }

  /* ---------- card images: explicit image → first image in the post → anime ---------- */
  var ANIME_ENDPOINTS = [
    "https://api.waifu.pics/sfw/waifu",
    "https://nekos.best/api/v2/neko"
  ];

  function fetchAnimeImage(index) {
    if (index >= ANIME_ENDPOINTS.length) return Promise.reject(new Error("no anime"));
    return fetch(ANIME_ENDPOINTS[index])
      .then(function (response) { return response.json(); })
      .then(function (data) {
        var url = data && (data.url || (data.results && data.results[0] && data.results[0].url));
        if (!url) return fetchAnimeImage(index + 1);
        return url;
      })
      .catch(function () { return fetchAnimeImage(index + 1); });
  }

  function firstArticleImage(pageUrl) {
    return fetch(pageUrl, { credentials: "same-origin" })
      .then(function (response) { return response.ok ? response.text() : Promise.reject(); })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        var content = doc.getElementById("quarto-document-content") || doc.body;
        var images = content.querySelectorAll("img");
        for (var i = 0; i < images.length; i++) {
          var src = images[i].getAttribute("src");
          if (!src || src.indexOf("data:") === 0) continue;
          return new URL(src, pageUrl).href;
        }
        return null;
      })
      .catch(function () { return null; });
  }

  function applyCardImage(card, src) {
    var frame = card.querySelector(".card-img-top");
    if (!frame) {
      frame = document.createElement("p");
      frame.className = "card-img-top";
      card.insertBefore(frame, card.firstChild);
    }
    var img = frame.querySelector("img");
    if (!img) {
      img = document.createElement("img");
      img.className = "thumbnail-image card-img";
      img.alt = "";
      frame.appendChild(img);
    }
    frame.classList.remove("img-missing");
    img.classList.remove("img-missing");
    img.src = src;
    return img;
  }

  function initImageFallback() {
    document.querySelectorAll("#quarto-document-content img").forEach(function (img) {
      img.addEventListener("error", function () { img.classList.add("img-missing"); });
    });

    document.querySelectorAll(".quarto-grid-item").forEach(function (card) {
      var link = card.closest("a.quarto-grid-link") || card.querySelector("a[href]");
      var href = link ? link.getAttribute("href") : null;
      if (!href) return;

      var frame = card.querySelector(".card-img-top");
      var img = frame ? frame.querySelector("img") : null;
      var hasImage = !!(img && img.getAttribute("src")) &&
        !(img.complete && img.naturalWidth === 0);
      var done = false;

      var useAnime = function () {
        fetchAnimeImage(0)
          .then(function (url) {
            var next = applyCardImage(card, url);
            next.addEventListener("error", function () {
              var holder = card.querySelector(".card-img-top");
              if (holder) holder.classList.add("img-missing");
            }, { once: true });
          })
          .catch(function () {
            var holder = card.querySelector(".card-img-top");
            if (holder) holder.classList.add("img-missing");
          });
      };

      // 优先使用正文的第一张图；没有正文图时保留 front matter 的 image，最后才用动漫图
      var upgrade = function () {
        if (done) return;
        done = true;
        var pageUrl = new URL(href, window.location.href).href;
        firstArticleImage(pageUrl).then(function (src) {
          if (src) {
            var next = applyCardImage(card, src);
            next.addEventListener("error", function () {
              if (!hasImage) useAnime();
            }, { once: true });
          } else if (!hasImage) {
            useAnime();
          }
        }).catch(function () {
          if (!hasImage) useAnime();
        });
      };

      upgrade();
    });
  }

  /* ---------- reveal cards on scroll ---------- */
  function initReveal() {
    if (reduceMotion || !("IntersectionObserver" in window)) return;
    var items = document.querySelectorAll(".quarto-grid-item");
    if (!items.length) return;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08, rootMargin: "0px 0px -30px 0px" });
    items.forEach(function (el) {
      el.classList.add("reveal");
      io.observe(el);
    });
  }

  /* ---------- header state ---------- */
  function initHeader() {
    var header = document.getElementById("quarto-header");
    if (!header) return;
    var update = function () {
      header.classList.toggle("is-scrolled", window.scrollY > 8);
    };
    window.addEventListener("scroll", update, { passive: true });
    update();
  }

  /* ---------- let very wide tables scroll inside their own box ---------- */
  function initTableScroll() {
    document.querySelectorAll("#quarto-document-content table").forEach(function (table) {
      var firstRow = table.querySelector("thead tr") || table.querySelector("tr");
      var cols = firstRow ? firstRow.children.length : 0;
      if (cols < 6) return;
      if (table.parentElement && table.parentElement.classList.contains("table-scroll")) return;
      var wrap = document.createElement("div");
      wrap.className = "table-scroll";
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    });
  }

  function boot() {
    initLiquidDocks();
    initThemePill();
    initBrand();
    initNavbarLayout();
    initNavLabels();
    initNavIcons();
    initIcons();
    initSortDropdowns();
    initSearch();
    initProgress();
    initMetaCleanup();
    initShare();
    initImageFallback();
    initTableScroll();
    initReveal();
    initHeader();
    window.setTimeout(initIcons, 350);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
