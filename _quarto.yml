project:
  type: website

website:
  title: "Jie Hua's Bioinformatics Notes"
  description: "A working notebook of reproducible bioinformatics — genomes, structures, and data visualization."
  site-url: https://bioinfor.jiehua1995.xyz
  image: images/social-card.png
  image-alt: "Jie Hua — Bioinformatics Notes"
  reader-mode: false
  sidebar: false
  search: true
  navbar:
    right:
      - text: "Archive"
        href: articles.qmd
      - text: "About"
        href: about.qmd
      - icon: github
        href: https://github.com/jiehua1995
      - icon: rss
        href: index.xml
  twitter-card:
    card-style: summary_large_image
  open-graph: true
  bread-crumbs: true
execute:
  freeze: auto

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    lightbox: true
    include-in-header:
      - custom-head.html
    include-after-body:
      - custom-body.html

editor: visual
